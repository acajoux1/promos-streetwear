<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Promos">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Promos Streetwear</title>
</head>
<body>
<svg class="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
<g id="fr">
<path d="M0 0C3 70 3 140 0 210" fill="none" stroke="currentColor" stroke-width="2.5"/>
<path id="lf" d="M0 0Q24 -12 50 2Q24 7 0 0Z" transform="translate(0,14)"/>
<use href="#lf" transform="translate(0,40) scale(1)"/>
<use href="#lf" transform="translate(0,66) scale(.95)"/>
<use href="#lf" transform="translate(0,92) scale(.85)"/>
<use href="#lf" transform="translate(0,118) scale(.7)"/>
<use href="#lf" transform="translate(0,144) scale(.55)"/>
<use href="#lf" transform="translate(0,170) scale(.4)"/>
<use href="#lf" transform="translate(0,14) scale(-1,1)"/>
<use href="#lf" transform="translate(0,40) scale(-1,1)"/>
<use href="#lf" transform="translate(0,66) scale(-.95,.95)"/>
<use href="#lf" transform="translate(0,92) scale(-.85,.85)"/>
<use href="#lf" transform="translate(0,118) scale(-.7,.7)"/>
<use href="#lf" transform="translate(0,144) scale(-.55,.55)"/>
<use href="#lf" transform="translate(0,170) scale(-.4,.4)"/>
</g>
<g id="fl">
<ellipse cx="0" cy="-13" rx="6.5" ry="14"/>
<ellipse cx="0" cy="-13" rx="6.5" ry="14" transform="rotate(72)"/>
<ellipse cx="0" cy="-13" rx="6.5" ry="14" transform="rotate(144)"/>
<ellipse cx="0" cy="-13" rx="6.5" ry="14" transform="rotate(216)"/>
<ellipse cx="0" cy="-13" rx="6.5" ry="14" transform="rotate(288)"/>
<circle r="4" fill="#d9a93f"/>
</g>
<g id="mo">
<path d="M0 0C-42 -18 -64 -72 -32 -104C-10 -120 22 -118 42 -96C68 -64 42 -14 0 0Z"/>
<path d="M0 0L-2 -100M-4 -30L-34 -42M-3 -55L-40 -75M3 -35L36 -46M4 -62L42 -78" stroke="#0a110e" stroke-width="3" fill="none"/>
</g>
</defs>
<g opacity=".55">
<use href="#mo" fill="#1f4a37" transform="translate(40,170) rotate(-20) scale(1.5)"/>
<use href="#mo" fill="#2c4a52" transform="translate(400,540) rotate(70) scale(1.4)"/>
<use href="#fr" color="#2d7c98" fill="#2d7c98" transform="translate(370,30) rotate(150) scale(1.2)"/>
<use href="#fr" color="#a8862f" fill="#a8862f" transform="translate(-10,430) rotate(-70) scale(1.3)"/>
<use href="#fr" color="#2d7c98" fill="#2d7c98" transform="translate(70,800) rotate(15) scale(1.6)"/>
<use href="#fr" color="#2f6b4c" fill="#2f6b4c" transform="translate(375,800) rotate(-20) scale(1.5)"/>
<use href="#fr" color="#a8862f" fill="#a8862f" transform="translate(320,800) rotate(-45) scale(1.2)"/>
<use href="#fl" fill="#cfe0f0" transform="translate(95,720) scale(1.5)"/>
<use href="#fl" fill="#cfe0f0" transform="translate(155,765) scale(1.1)"/>
<use href="#fl" fill="#e58aa6" transform="translate(335,735) scale(1.4)"/>
<use href="#fl" fill="#e59a7a" transform="translate(290,780) scale(1)"/>
<use href="#fl" fill="#e58aa6" transform="translate(205,40) scale(1.2)"/>
<use href="#fl" fill="#cfe0f0" transform="translate(60,70) scale(1)"/>
</g>
</svg>
<div class="app">
<h1>Promos Streetwear</h1>
<p class="sub" id="maj">Chargement…</p>
<div id="bar">
<div class="row">
<input id="q" placeholder="Rechercher marque, modèle…" oninput="onSearch()">
<button class="fbtn" id="fBtn" onclick="togglePanel()">⚙ Filtres</button>
<button class="fbtn" id="cFav" onclick="toggleFav2()">♥ 0</button>
</div>
<div class="tabs" id="gens"></div>
<div class="tabs" id="cats"></div>
<div class="panel" id="panel">
<div class="row">
<select id="boutique" onchange="apply()"><option value="">Toutes les boutiques</option></select>
<select id="remise" onchange="apply()">
<option value="0">Toutes remises</option><option value="20">−20 % et +</option>
<option value="30">−30 % et +</option><option value="40">−40 % et +</option><option value="50">−50 % et +</option>
</select>
</div>
<div class="row">
<input id="pmax" type="number" inputmode="decimal" placeholder="Prix max (€)" oninput="onSearch()">
<select id="tri" onchange="apply()">
<option value="remise">Plus grosse remise</option>
<option value="prix">Prix croissant</option>
<option value="prixd">Prix décroissant</option>
</select>
</div>
<div id="szLet"></div>
<div id="szSys"></div>
<div id="szNum"></div>
<div class="prow">
<button class="chip" id="cNew" onclick="toggleNew()">✨ Nouveautés</button>
<button class="chip" onclick="resetAll()">Réinitialiser</button>
</div>
<button class="more" id="showRes" onclick="closePanel()">Voir les résultats</button>
</div>
</div>
<div class="sub" id="n"></div>
<div class="grid" id="g"></div>
<div id="moreWrap"></div>
</div>
<button id="top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script src="app.js"></script>
</body>
</html>
