<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Promos">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Promos Streetwear</title>
</head>
<body>
<svg class="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1820"/>
<stop offset=".38" stop-color="#12303a"/>
<stop offset=".62" stop-color="#3d4a45"/>
<stop offset=".72" stop-color="#8a5a42"/>
<stop offset="1" stop-color="#4a2a22"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#e8cf9c" stop-opacity=".45"/>
<stop offset="1" stop-color="#e8cf9c" stop-opacity="0"/>
</radialGradient>
<g id="bao">
<path d="M-12 0C-9 -40 -7 -80 -8 -112L8 -112C7 -80 8 -40 12 0Z" stroke="none"/>
<path d="M-6 -108L-30 -134M-2 -110L-14 -148M3 -110L12 -148M7 -108L32 -132M0 -112L2 -156" fill="none" stroke-width="3.5" stroke-linecap="round"/>
<ellipse cx="-32" cy="-136" rx="14" ry="6"/>
<ellipse cx="-15" cy="-150" rx="13" ry="6"/>
<ellipse cx="13" cy="-150" rx="13" ry="6"/>
<ellipse cx="34" cy="-134" rx="14" ry="6"/>
<ellipse cx="2" cy="-158" rx="12" ry="5"/>
</g>
</defs>
<rect width="400" height="800" fill="url(#sky)"/>
<circle cx="268" cy="520" r="95" fill="url(#glow)"/>
<circle cx="268" cy="520" r="30" fill="#e8cf9c" opacity=".5"/>
<path d="M0 575L30 548L55 560L95 515L130 552L165 530L200 560L238 522L262 540L286 535L296 505L306 505L318 538L328 545L360 528L400 548L400 800L0 800Z" fill="#24474f" opacity=".7"/>
<path d="M0 610Q70 585 140 603T270 598T400 604L400 800L0 800Z" fill="#1b3b42" opacity=".9"/>
<g fill="#173238" stroke="#173238">
<use href="#bao" transform="translate(30,606) scale(.3)"/>
<use href="#bao" transform="translate(110,603) scale(.26)"/>
<use href="#bao" transform="translate(175,604) scale(.32)"/>
<use href="#bao" transform="translate(250,600) scale(.27)"/>
<use href="#bao" transform="translate(320,603) scale(.3)"/>
<use href="#bao" transform="translate(380,604) scale(.25)"/>
</g>
<path d="M0 665Q90 640 180 658T400 650L400 800L0 800Z" fill="#122a30"/>
<g fill="#0f2328" stroke="#0f2328">
<use href="#bao" transform="translate(60,668) scale(.55)"/>
<use href="#bao" transform="translate(150,661) scale(.5)"/>
<use href="#bao" transform="translate(240,658) scale(.6)"/>
<use href="#bao" transform="translate(335,656) scale(.5)"/>
</g>
<path d="M0 730Q120 712 240 726T400 718L400 800L0 800Z" fill="#0b1a1d"/>
<path d="M0 762Q150 744 400 760L400 800L0 800Z" fill="#2b1a16" opacity=".9"/>
<g fill="#081214" stroke="#081214">
<use href="#bao" transform="translate(52,775) scale(1.15)"/>
<use href="#bao" transform="translate(352,780) scale(.95)"/>
</g>
<rect width="400" height="800" fill="#000" opacity=".18"/>
</svg>
<div class="app">
<h1>Promos Streetwear</h1>
<p class="sub" id="maj">Chargement…</p>
<div id="bar">
<div class="row">
<button class="fbtn" id="fBtn" onclick="togglePanel()" aria-label="Menu">☰</button>
<input id="q" placeholder="Rechercher marque, modèle…" oninput="onSearch()">
<button class="fbtn" id="cFav" onclick="toggleFav2()">♥ 0</button>
</div>
</div>
<div class="sub" id="n"></div>
<div class="grid" id="g"></div>
<div id="moreWrap"></div>
</div>
<button id="top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div id="drawer">
<div class="dr-bg" onclick="closePanel()"></div>
<div class="dr-body">
<div class="dr-head"><span>Menu</span><button class="sh-x" onclick="closePanel()">✕</button></div>
<div id="panel">
<div class="lbl">Rayon</div>
<div class="tabs" id="gens"></div>
<div class="lbl">Catégories</div>
<div class="tabs" id="cats"></div>
<div class="lbl">Collections</div>
<div class="prow">
<button class="chip" id="cNew" onclick="toggleNew()">✨ Nouveautés</button>
</div>
<div class="lbl">Boutique</div>
<select id="boutique" onchange="apply()"><option value="">Toutes les boutiques</option></select>
<div class="lbl">Remise minimale</div>
<select id="remise" onchange="apply()">
<option value="0">Toutes remises</option><option value="20">−20 % et +</option>
<option value="30">−30 % et +</option><option value="40">−40 % et +</option><option value="50">−50 % et +</option>
</select>
<div class="lbl">Prix maximum</div>
<input id="pmax" type="number" inputmode="decimal" placeholder="Prix max (€)" oninput="onSearch()">
<div class="lbl">Tri</div>
<select id="tri" onchange="apply()">
<option value="remise">Plus grosse remise</option>
<option value="prix">Prix croissant</option>
<option value="prixd">Prix décroissant</option>
</select>
<div id="szLet"></div>
<div id="szSys"></div>
<div id="szNum"></div>
<div class="prow" style="margin-top:14px"><button class="chip" onclick="resetAll()">Tout réinitialiser</button></div>
</div>
<div class="dr-foot"><button class="more" id="showRes" onclick="closePanel()">Voir les résultats</button></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
