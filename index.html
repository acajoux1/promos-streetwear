<h1>Promos Streetwear</h1>
<p class="sub" id="maj">Chargement…</p>
</div>
<div id="bar">
<div class="row">
<button class="fbtn" id="fBtn" onclick="togglePanel()" aria-label="Menu">☰</button>
<input id="q" placeholder="Rechercher…" oninput="onSearch()">
<button class="fbtn" id="cBell" onclick="openAlerts()" aria-label="Alertes">🔔</button>
<button class="fbtn" id="cFav" onclick="toggleFav2()">♥ 0</button>
</div>
<div class="pills2" id="pills"></div>
</div>
<div class="sub" id="n"></div>
<div class="grid" id="g"></div>
<div id="moreWrap"></div>
</div>
<button id="top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div id="drawer">
<div class="dr-bg" onclick="closePanel()"></div>
<div class="dr-body">
<div class="dr-head"><span>Menu</span><button class="sh-x" onclick="closePanel()">✕</button></div>
<div id="panel">
<details class="sec" open>
<summary><span>Rayon &amp; catégorie<i class="bdg" id="bd1" style="display:none"></i></span></summary>
<div class="sec-body">
<div class="tabs" id="gens"></div>
<div class="tabs" id="cats"></div>
</div>
</details>
<details class="sec">
<summary><span>Collections<i class="bdg" id="bd2" style="display:none"></i></span></summary>
<div class="sec-body">
<div class="prow">
<button class="chip" id="cNew" onclick="toggleNew()">✨ Nouveautés</button>
<button class="chip" id="cTop" onclick="toggleTop()">🏆 Top 30</button>
<button class="chip" id="cRE" onclick="toggleRE()">🇷🇪 Livre à La Réunion</button>
</div>
<div class="s" style="margin-top:8px">Seul Laced Run (Saint-Denis) est vérifié pour La Réunion.</div>
</div>
</details>
<details class="sec">
<summary><span>Boutique &amp; prix<i class="bdg" id="bd3" style="display:none"></i></span></summary>
<div class="sec-body">
<div class="lbl">Boutique</div>
<select id="boutique" onchange="apply()"><option value="">Toutes les boutiques</option></select>
<div class="lbl">Remise minimale</div>
<select id="remise" onchange="apply()">
<option value="0">Toutes remises</option><option value="20">−20 % et +</option>
<option value="30">−30 % et +</option><option value="40">−40 % et +</option><option value="50">−50 % et +</option>
</select>
<div class="lbl">Prix maximum</div>
<input id="pmax" type="number" inputmode="decimal" placeholder="Prix max (€)" oninput="onSearch()">
<div class="lbl">Tri</div>
<select id="tri" onchange="apply()">
<option value="remise">Plus grosse remise</option>
<option value="prix">Prix croissant</option>
<option value="prixd">Prix décroissant</option>
</select>
</div>
</details>
<details class="sec">
<summary><span>Marques &amp; tailles<i class="bdg" id="bd4" style="display:none"></i></span></summary>
<div class="sec-body">
<div id="szLet"></div>
<div id="szSys"></div>
<div id="szNum"></div>
</div>
</details>
<details class="sec">
<summary><span>Alertes &amp; liens</span></summary>
<div class="sec-body">
<div class="lbl">Alertes</div>
<div class="prow">
<button class="chip" id="cSave" onclick="saveAlert()">🔔 Enregistrer cette recherche</button>
<button class="chip" onclick="openAlertsFromPanel()">Mes alertes</button>
</div>
<div class="lbl">Autres boutiques</div>
<div class="prow">
<a class="chip" style="text-decoration:none" href="https://www.fenom.com/fr/123-outlet" target="_blank" rel="noopener">Fenom · Outlet ↗</a>
<a class="chip" style="text-decoration:none" href="https://secondemain.lacoste.com/" target="_blank" rel="noopener">Lacoste seconde main ↗</a>
</div>
</div>
</details>
</div>
<div class="dr-foot"><button class="fbtn" onclick="resetAll()">Réinitialiser</button><button class="more" id="showRes" onclick="closePanel()">Voir les résultats</button></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
