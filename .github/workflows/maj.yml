name: Mise à jour des promos

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper.py
      - run: |
          git config user.name "promos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/promos.json data/history.json
          git commit -m "Mise à jour des promos" || echo "Rien de nouveau"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
