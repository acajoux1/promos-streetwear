name: Mise à jour des promos

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "size_prices.py"
      - "feed.py"
      - ".github/workflows/maj.yml"

permissions:
  contents: write

concurrency:
  group: maj
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests des prix par taille
        run: python -m unittest discover -p 'test*.py' -v
      - name: Mise à jour des promotions
        run: python scraper.py
      - name: Génération des prix par taille
        run: python size_prices.py
      - name: Flux RSS et plan du site
        run: python feed.py
      - name: Publication des données
        run: |
          git config user.name "promos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/promos.json data/history.json data/prix_tailles.json data/tailles_index.json data/sante.json feed.xml sitemap.xml p
          git diff --cached --quiet && echo 'Rien de nouveau' && exit 0
          git commit -m "Mise à jour des promos et des prix par taille"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
      # Après la publication : les données valides sont déjà en ligne, et un
      # échec ici prévient le propriétaire par le courriel de GitHub.
      - name: Contrôle de santé des collectes
        run: python verifie_sante.py
