name: Mise à jour des promos

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "size_prices.py"
      - "schema.py"
      - "couverture.py"
      - "boutiques.json"
      - "feed.py"
      - "pipeline.py"
      - "version_sw.py"
      - "requirements-ci.txt"
      - ".github/workflows/maj.yml"

permissions:
  contents: write

concurrency:
  group: maj
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    # Une boutique qui ne répond plus ne doit pas retenir la file horaire
    # indéfiniment derrière un passage bloqué.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntaxe JavaScript
        run: node --check app.js && node --check veille.js && node --check sw.js
      # Version épinglée : elle fixe aussi la version de Chromium installée.
      - name: Dépendances de test
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Cache du navigateur
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}
      # Chromium et ses bibliothèques système : sans cela les tests
      # d'interface de test_interface.py seraient ignorés.
      - name: Installation de Chromium
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m unittest discover -p 'test*.py' -v
      # Un seul passage, dans l'ordre tenu par pipeline.py : collecte, prix par
      # taille, contrat des données, flux. Une étape critique en échec arrête
      # tout ; une étape non critique laisse les suivantes tourner sur les
      # fichiers précédents, et le run rougit en fin de job.
      - name: Collecte, prix par taille et flux
        id: collecte
        continue-on-error: true
        run: python pipeline.py
      # La version du cache du service worker suit le contenu de la coquille :
      # plus de bump à retenir à la main.
      - name: Version du cache du service worker
        run: python version_sw.py
      - name: Publication des données
        run: |
          git config user.name "promos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data feed.xml sitemap.xml p sw.js
          git diff --cached --quiet && echo 'Rien de nouveau' && exit 0
          git commit -m "Mise à jour des promos et des prix par taille"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
      # Après la publication : les données valides sont déjà en ligne, et un
      # échec ici prévient le propriétaire par le courriel de GitHub.
      - name: Contrôle de santé des collectes
        run: python verifie_sante.py
      # Images, prix barrés, prix par taille : ce qui manque *dans* les
      # articles, pas seulement leur nombre.
      - name: Contrôle de couverture
        run: python couverture.py
      # Les données valides ont été publiées ; le passage reste rouge pour que
      # l'incident soit visible et signalé (incident.yml).
      - name: Signalement d'une collecte dégradée
        if: steps.collecte.outcome == 'failure'
        run: |
          echo "Collecte ou contrat des données en échec : voir l'étape « Collecte, prix par taille et flux »."
          exit 1
