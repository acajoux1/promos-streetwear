name: Debug sites

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python debug.py
      - run: |
          git config user.name "promos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/debug.txt
          git commit -m "debug" || echo "rien"
          git push
